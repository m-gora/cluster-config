# ExternalDNS (chart kubernetes-sigs external-dns 1.23.0, app 0.23.0)
#
# Only manages records under cloud.marcodoes.tech. All other records in the
# Cloudflare zone stay hand-managed in the Cloudflare console - external-dns
# never touches them (it filters strictly).
#
# Sources: Gateway objects (the cluster's entrypoint) and Ingress.
# TXT registry is enabled by default in this chart? No - set registry to
# none explicitly? (default is 'txt', which adds ownership markers; keep the
# default markers so external-dns cleans up only its own records.)
provider: cloudflare

domainFilters:
  - cloud.marcodoes.tech

# Never let it touch anything else in the zone
excludeDomains:
  - marcodoes.tech

policy: sync
txtOwnerId: cloud-marcodoes-tech

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns
        key: token
