# Cluster entrypoint for Gateway API. Traefik (via ServiceLB on the node's
# 80/443) advertises this Gateway; external-dns watches it, and every app
# HTTPRoute that binds to it gets a DNS record automatically.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: cloud.marcodoes.tech
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: All }
    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: "*.cloud.marcodoes.tech"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-cloud-marcodoes-tech-tls
      allowedRoutes:
        namespaces: { from: All }
