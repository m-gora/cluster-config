# Helm values for hcloud CSI driver (chart version 2.24.1).
#
# Reuses the `hcloud` secret in kube-system (key `token`), the same
# read+write project token the CCM uses.
#
# The StorageClass created is `hcloud-volumes` (cluster default), reclaim
# policy Delete: deleting a PVC deletes the Hetzner volume.
controller:
  # With the default location pinned, the controller pod may run anywhere.
  # All current nodes are fsn1.
  hcloudVolumeDefaultLocation: "fsn1"

storageClasses:
  # Chart default minus `defaultStorageClass: true`: k3s ships local-path as
  # the default class; hcloud-volumes is for stateful workloads explicitly.
  - name: hcloud-volumes
    defaultStorageClass: false
    reclaimPolicy: Delete
