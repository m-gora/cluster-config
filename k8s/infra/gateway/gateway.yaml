# Cluster entrypoint for Gateway API. Traefik (via ServiceLB on the node's
# 80/443) advertises this Gateway; every app HTTPRoute that binds to it and
# carries the externaldns.kubernetes.io/enabled=true label gets a DNS
# record automatically (the Gateway itself is not a record).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster
  namespace: kube-system
spec:
  gatewayClassName: traefik
  listeners:
    # Traefik's Gateway provider maps listeners onto its entrypoints, whose
    # container ports are 8000/8443 in the k3s chart (80/443 are the
    # ServiceLB-published ports on the node; external traffic is unaffected).
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces: { from: All }
    - name: websecure
      protocol: HTTPS
      port: 8443
      hostname: "*.cloud.marcodoes.tech"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-cloud-marcodoes-tech-tls
      allowedRoutes:
        namespaces: { from: All }
