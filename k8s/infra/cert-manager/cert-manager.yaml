# cert-manager — Flux-managed. Wildcard issuer lives in
# clusterissuer-letsencrypt.yaml, the wildcard cert in certificate-wildcard.yaml.
# CRDs come from the chart itself (crds.enabled), same as the manual install.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
      interval: 12m
  values:
    crds:
      enabled: true
    # Control-plane service: pinned to the CP node (small workers are for
    # app workloads). The taint toleration matches Flux/hccm.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
