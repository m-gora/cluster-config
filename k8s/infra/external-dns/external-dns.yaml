# ExternalDNS — now managed by Flux (GitRepository/Kustomization in
# flux-system/). Chart version pinned to the release that was installed
# manually (adopted by helm-controller: same release name + namespace, so
# the existing helm release storage is taken over, no re-install).
#
# Only manages records under cloud.marcodoes.tech. All other records in the
# Cloudflare zone stay hand-managed in the Cloudflare console - external-dns
# never touches them (it filters strictly).
#
# Cloudflare for SaaS: with --cloudflare-custom-hostnames set, external-dns
# also registers each annotated host as a custom hostname in the
# marcodoes.tech SaaS zone (origin = the DNS record itself), so every host
# gets its own edge certificate and can be proxied (orange cloud, WAF)
# without a wildcard edge cert (free Universal SSL only covers one level).
#
# Apps opt in via annotations on the HTTPRoute:
#   external-dns.kubernetes.io/cloudflare-proxied: "true"   -> orange cloud
#   external-dns.kubernetes.io/cloudflare-custom-hostname:  -> host(s) to
#     register as custom hostname(s), comma-separated
# Without the proxied annotation records stay gray-clouded (proxied is
# per-resource; the TXT ownership records are never proxied). Custom
# hostname sync follows policy: sync - removed routes also get their custom
# hostnames removed. Cert validation is HTTP (port 80), so it works even
# with the record proxied. Free plan: ~100 custom hostnames, HTTP
# validation only.
#
# The Cloudflare token comes from the `cloudflare-dns` secret in
# kube-system (SOPS-encrypted: secret-cloudflare-dns.yaml in this
# directory) and needs Zone:Read, DNS:Edit and
# SSL and Certificates:Edit (custom hostnames API) on marcodoes.tech - the
# same secret cert-manager consumes for DNS01.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubernetes-sigs
  namespace: kube-system
spec:
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: kube-system
spec:
  # Interval is only a re-check safety net; a git push updates the CR and
  # triggers reconciliation immediately.
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: kubernetes-sigs
      interval: 12m
  values:
    # Sources: Gateway objects (the cluster's entrypoint) and Ingress.
    sources:
      - gateway-httproute
      - ingress
    # Legacy chart syntax (deprecated in 1.23 but still supported; the new
    # `providers:` key is for webhook-based providers and would fall back to
    # aws).
    provider: cloudflare
    # The CF zone that holds the records (a domain filter must match the
    # zone name; a subdomain filter would require a dedicated zone). Scope
    # control: only resources carrying the label below produce DNS records.
    domainFilters:
      - marcodoes.tech
    labelFilter: externaldns.kubernetes.io/enabled=true
    policy: sync
    txtOwnerId: cloud-marcodoes-tech
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-dns
            key: token
    # Cloudflare for SaaS: register annotated hosts as custom hostnames in
    # the SaaS zone (per-host edge certs, enables proxied/WAF). Proxied
    # itself stays per-resource via the cloudflare-proxied annotation.
    extraArgs:
      - --cloudflare-custom-hostnames
      - --cloudflare-custom-hostnames-min-tls-version=1.2
    # Control-plane service: pinned to the CP node (small workers are for
    # app workloads). The taint toleration matches Flux/hccm.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
