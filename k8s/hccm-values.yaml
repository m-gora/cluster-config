# Helm values for hcloud-cloud-controller-manager (chart version 1.39.3,
# >= 1.30.1 required since Hetzner removed the datacenter API field).
#
# The chart reads the API token from the `hcloud` secret, key `token`
# (created manually; not applied from this repo unencrypted).
#
# Single control plane: pin the single CCM replica to it. The chart's
# default tolerations cover the control-plane taint, the
# node.cloudprovider.kubernetes.io/uninitialized taint, and not-ready.
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

env:
  # The CCM only advertises the node's private IP (10.0.1.x) when it knows
  # the Hetzner network. Without it, the k8s cloud-node controller rejects
  # the node: kubelet advertises node-ip=10.0.1.10, which the CCM's
  # InstanceMetadata() then fails to match (internal/instance/instances.go).
  HCLOUD_NETWORK:
    value: "12822059"
  # Keep route reconciliation off: flannel encapsulates node-to-node pod
  # traffic, so pod CIDR routes in the Hetzner network are not needed.
  # (This env var defaults to true whenever HCLOUD_NETWORK is set.)
  HCLOUD_NETWORK_ROUTES_ENABLED:
    value: "false"
