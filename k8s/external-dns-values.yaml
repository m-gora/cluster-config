# ExternalDNS (chart kubernetes-sigs external-dns 1.23.0, app 0.23.0)
#
# Only manages records under cloud.marcodoes.tech. All other records in the
# Cloudflare zone stay hand-managed in the Cloudflare console - external-dns
# never touches them (it filters strictly).
#
# Sources: Gateway objects (the cluster's entrypoint) and Ingress.
sources:
  - gateway-httproute
  - ingress

# Legacy chart syntax (deprecated in 1.23 but still supported; the new
# `providers:` key is for webhook-based providers and would fall back to aws).
provider: cloudflare

# The CF zone that holds the records (a domain filter must match the zone
# name; a subdomain filter would require a dedicated zone). Scope control:
# only resources carrying the label below produce DNS records, so the rest
# of the zone is out of external-dns's reach.
domainFilters:
  - marcodoes.tech

labelFilter: "externaldns.kubernetes.io/enabled=true"

policy: sync
txtOwnerId: cloud-marcodoes-tech

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns
        key: token
