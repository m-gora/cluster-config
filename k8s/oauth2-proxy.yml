# Shared forward-auth component (oauth2-proxy) for apps behind the cluster
# Gateway. Config mirrors the dpp docker-compose.prod.yml oauth2-proxy
# service; domain-scoped to dpp.cloud.marcodoes.tech — a second app gets
# its own instance rather than extending this one.
#
# Secrets (client-id, client-secret, cookie-secret, issuer-url) live in the
# `oauth2-proxy` Secret, created out of git once the Auth0 app values exist.
apiVersion: v1
kind: Namespace
metadata:
  name: oauth
---
# Lets HTTPRoutes in the dpp namespace route /oauth2/* to the oauth2-proxy
# Service here (Gateway API requires a ReferenceGrant in the target
# namespace for cross-namespace backendRefs). Extend `from` per app.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-dpp-httproutes
  namespace: oauth
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: dpp
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: oauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
        app.kubernetes.io/part-of: cluster-auth
    spec:
      # Tiny, stateless, cluster-wide concern: belongs on the control plane
      # (same class as cert-manager/external-dns), keeping it available even
      # when the worker is down. Tolerate both cp taints; no nodeSelector —
      # the worker remains a valid target too.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/etcd
          operator: Exists
          effect: NoExecute
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: static://200
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: issuer-url
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: cookie-secret
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_DOMAINS
              value: dpp.cloud.marcodoes.tech
            - name: OAUTH2_PROXY_WHITELIST_DOMAINS
              value: dpp.cloud.marcodoes.tech
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_ACCESS_TOKEN
              value: "false"
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: oauth
  labels:
    app: oauth2-proxy
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
