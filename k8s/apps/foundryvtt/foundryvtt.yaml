# Foundry VTT (v13) — felddy/foundryvtt-docker.
#
# Entirely external project: public image, no upstream chart or Flux
# manifests to point at. Manifests live here; Renovate bumps the pinned
# image tag (held to <14 via a Renovate packageRule: modules lag behind
# Foundry majors). Never use the moving `release`/`latest` tag.
#
# Versioning convention: the StatefulSet (and its Service/HTTPRoute/labels)
# encode the major version — foundry13 today, a parallel foundry14 later —
# copy this directory, rename foundryvtt->foundry14 occurrences and pick a
# different hostname. The namespace, configmap and secret stay version
# agnostic so both instances share credentials and layout (adjust the
# configmap if the v14 instance gets a different FOUNDRY_HOSTNAME). This
# keeps v13 serving while v14 is validated against real data.
#
# Non-sensitive configuration lives in configmap-foundryvtt.yaml (envFrom),
# credentials in secret-foundryvtt.yaml (SOPS-encrypted). The felddy image
# regenerates Foundry's config files from env on every start — env is the
# source of truth, in-app GUI config changes do not persist.
#
# SFTP sidecar: atmoz/sftp runs in the same pod because the data volume is
# RWO — no separate server could mount it. Single shared login `foundry`
# (SSH-key-only, keys in the sftp-authorized-keys secret), uid/gid 1000 to
# match felddy's `node` user, chrooted view of the assets tree at
# <home>/assets. Reached via the foundry13-sftp Service (node port 8222,
# firewall: admin_cidrs) by connecting to any node IP directly — no DNS
# record, SSH can't ride the Traefik Gateway or Cloudflare's proxy anyway,
# see the Service comment.
#
# StatefulSet, not Deployment: stateful monolith on an RWO Hetzner volume —
# one pod replaced at a time (no two pods fighting over the volume), stable
# pod identity/DNS, per-replica PVC via volumeClaimTemplates, same pattern
# as postgres. Deleting the StatefulSet keeps the PVC. Caveat: the PVC comes
# from the volumeClaimTemplates entry, which cannot be renamed later without
# forcing a broken update — get size/storage class right up front.
apiVersion: v1
kind: Namespace
metadata:
  name: foundryvtt
---
apiVersion: v1
kind: Service
metadata:
  name: foundry13
  namespace: foundryvtt
  labels:
    app: foundry13
spec:
  selector:
    app: foundry13
  ports:
    - name: http
      port: 30000
      targetPort: http
---
# SFTP ingress — SSH is not HTTP: it can't ride the Traefik Gateway
# (HTTP/HTTPS listeners only) and Cloudflare's proxy can't carry it either
# (Spectrum is enterprise-only), so it gets a dedicated LoadBalancer
# Service, published on the node by ServiceLB like the Traefik Gateway
# service (free, no Hetzner LB product; the DaemonSet binds 8222 on every
# node, so any node IP works). Port is deliberately not 22 — that is node
# SSH; the firewall opens 8222 for admin_cidrs only (tofu/firewall.tf).
# No DNS by design: clients connect directly to a node IP, so external-dns
# stays out of this.
apiVersion: v1
kind: Service
metadata:
  name: foundry13-sftp
  namespace: foundryvtt
  labels:
    app: foundry13
spec:
  type: LoadBalancer
  selector:
    app: foundry13
  ports:
    - name: sftp
      port: 8222
      targetPort: sftp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: foundry13
  namespace: foundryvtt
  labels:
    externaldns.kubernetes.io/enabled: "true"
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    external-dns.kubernetes.io/cloudflare-custom-hostname: vtt.cloud.marcodoes.tech
spec:
  parentRefs:
    - name: cluster
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - vtt.cloud.marcodoes.tech
  rules:
    - backendRefs:
        - name: foundry13
          port: 30000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: foundry13
  namespace: foundryvtt
spec:
  replicas: 1
  serviceName: foundry13
  selector:
    matchLabels:
      app: foundry13
  template:
    metadata:
      labels:
        app: foundry13
    spec:
      terminationGracePeriodSeconds: 60
      hostname: foundry
      containers:
        # SFTP sidecar (atmoz/sftp): must live in this pod — the data
        # volume is RWO, so no separate server could share it. The image
        # ships only rolling tags (daily builds); pinned by digest and
        # Renovate bumps it (see renovate.json).
        - name: sftp
          image: atmoz/sftp:alpine@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372
          ports:
            - name: sftp
              containerPort: 22
          readinessProbe:
            tcpSocket:
              port: sftp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: sftp
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            # atmoz chroots users to their home dir, and the chroot root
            # must stay root-owned/unwritable. So the assets tree goes one
            # level down (<home>/assets) — mounting it AT the chroot would
            # also drag atmoz's root:root chown over the directory the
            # felddy container writes to.
            - name: data
              mountPath: /home/foundry/assets
              subPath: Data/assets
            # Single login `foundry`, SSH-key-only: users.conf entry has an
            # empty password (configmap-sftp.yaml), uid/gid 1000:1000 to
            # match the felddy image's `node` user, so uploads are owned by
            # the same user Foundry runs as.
            - name: sftp-users
              mountPath: /etc/sftp/users.conf
              subPath: users.conf
            # atmoz appends every file under .ssh/keys/ to the user's
            # authorized_keys on start — mounting authorized_keys itself is
            # explicitly not supported (OpenSSH file-permission rules).
            - name: authorized-keys
              mountPath: /home/foundry/.ssh/keys
        - name: foundry13
          image: felddy/foundryvtt:13.351.0
          envFrom:
            - configMapRef:
                name: foundryvtt-env
          env:
            - name: FOUNDRY_VERSION
              value: "13.351"
            # foundryvtt.com account: the image downloads the Foundry
            # distribution at startup (also cached in /data/container_cache).
            - name: FOUNDRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: foundryvtt
                  key: username
            - name: FOUNDRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foundryvtt
                  key: password
            - name: FOUNDRY_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: foundryvtt
                  key: admin-key
          ports:
            - name: http
              containerPort: 30000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: authorized-keys
          secret:
            secretName: sftp-authorized-keys
        - name: sftp-users
          configMap:
            name: sftp-users
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: foundry13
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 10Gi