# hcloud CSI driver — Flux-managed.
#
# Reuses the `hcloud` secret in kube-system (key `token`), the same
# read+write project token the CCM uses.
#
# The StorageClass created is `hcloud-volumes`, reclaim policy Delete:
# deleting a PVC deletes the Hetzner volume.
#
# The `hetzner-cloud` HelmRepository is declared in hccm.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hccm-csi
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: hcloud-csi
      version: "2.24.1"
      sourceRef:
        kind: HelmRepository
        name: hetzner-cloud
      interval: 12m
  values:
    controller:
      # With the default location pinned, the controller pod may run
      # anywhere. All current nodes are fsn1.
      hcloudVolumeDefaultLocation: "fsn1"
    storageClasses:
      # Chart default minus `defaultStorageClass: true`: k3s ships local-path
      # as the default class; hcloud-volumes is for stateful workloads
      # explicitly.
      - name: hcloud-volumes
        defaultStorageClass: false
        reclaimPolicy: Delete
