# Sidecar reference spec for oauth2-proxy — lives in the APP repos, not here.
#
# This file documents the pattern that was moved out of cluster-config
# (commit "k8s: remove standalone oauth2-proxy - sidecar in app pods").
# cluster-config keeps only shared infra (namespaces, storage); each app
# embeds oauth2-proxy as a sidecar and owns its auth config.
#
# Pattern: proxy mode. The oauth2-proxy container is the pod's front:
#   HTTPRoute → app Service :4180 (this container) → 127.0.0.1:8000 (app)
# The app's own port (8000) is NOT exposed via the Service, so the only
# ingress path is through the auth sidecar.
#
# Identity headers sent to the app (proxy mode defaults, verified against
# oauth2-proxy v7.15 source):
#   X-Forwarded-User   <- claim "user" (UserClaim defaults to "sub",
#                       so Auth0 sub values like google-oauth2|123...)
#   X-Forwarded-Email  <- claim "email"
# Client-supplied X-Forwarded-User/Email/Groups are STRIPPED before
# injection (PreserveRequestValue=false by default) - no spoofing.
#
# RFC 6749: client_id and the issuer URL are NOT secret - plain env /
# ConfigMap. Only client-secret and cookie-secret go into a Secret
# (created out of git; name it e.g. `auth` in the app namespace).
#
# Copy for the dpp Deployment (container alongside the app container):

containers:
  - name: oauth2-proxy
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    env:
      - name: OAUTH2_PROXY_HTTP_ADDRESS
        value: 0.0.0.0:4180
      - name: OAUTH2_PROXY_PROVIDER
        value: oidc
      # NOT secret (RFC 6749 2.3.1): client_id + issuer stay in plain env.
      - name: OAUTH2_PROXY_CLIENT_ID
        value: <AUTH0_CLIENT_ID>
      - name: OAUTH2_PROXY_OIDC_ISSUER_URL
        value: https://<AUTH0_TENANT>.<REGION>.auth0.com/
      - name: OAUTH2_PROXY_CLIENT_SECRET
        valueFrom:
          secretKeyRef: { name: auth, key: client-secret }
      - name: OAUTH2_PROXY_COOKIE_SECRET
        valueFrom:
          secretKeyRef: { name: auth, key: cookie-secret }
      - name: OAUTH2_PROXY_UPSTREAMS
        value: http://127.0.0.1:8000
      - name: OAUTH2_PROXY_COOKIE_SECURE
        value: "true"
      - name: OAUTH2_PROXY_COOKIE_DOMAINS
        value: dpp.cloud.marcodoes.tech
      - name: OAUTH2_PROXY_WHITELIST_DOMAINS
        value: dpp.cloud.marcodoes.tech
      - name: OAUTH2_PROXY_EMAIL_DOMAINS
        value: "*"
      - name: OAUTH2_PROXY_PASS_ACCESS_TOKEN
        value: "false"
      - name: OAUTH2_PROXY_REVERSE_PROXY
        value: "true"
    ports:
      - name: http
        containerPort: 4180
    readinessProbe:
      httpGet: { path: /ping, port: http }
      initialDelaySeconds: 5
    livenessProbe:
      httpGet: { path: /ping, port: http }
      initialDelaySeconds: 10
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
